      <rect x="20" y="128" width="100" height="24" rx="3" fill="#FFFFFF" stroke="#1F3864"/>
      <text x="70" y="144" text-anchor="middle" font-size="11" fill="#1F3864">Yes</text>
      <rect x="130" y="128" width="100" height="24" rx="3" fill="#FFFFFF" stroke="#1F3864"/>
      <text x="180" y="144" text-anchor="middle" font-size="11" fill="#1F3864">No</text>

      <text x="20" y="178" font-size="12" font-weight="700" fill="#333333">Have you retained an attorney already?</text>
      <rect x="20" y="186" width="100" height="24" rx="3" fill="#FFFFFF" stroke="#1F3864"/>
      <text x="70" y="202" text-anchor="middle" font-size="11" fill="#1F3864">Yes</text>
      <rect x="130" y="186" width="100" height="24" rx="3" fill="#FFFFFF" stroke="#1F3864"/>
      <text x="180" y="202" text-anchor="middle" font-size="11" fill="#1F3864">No</text>

      <rect x="20" y="234" width="180" height="30" rx="4" fill="#548235"/>
      <text x="110" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">CONTINUE →</text>
