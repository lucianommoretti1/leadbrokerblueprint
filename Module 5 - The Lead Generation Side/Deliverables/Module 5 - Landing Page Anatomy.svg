    <text x="660" y="218" font-size="12" fill="#333333">Real trust signals:</text>
    <text x="660" y="232" font-size="12" fill="#333333">bar memberships,</text>
    <text x="660" y="246" font-size="12" fill="#333333">BBB, professional</text>
    <text x="660" y="260" font-size="12" fill="#333333">associations.</text>

    <!-- Multi-step form -->
    <g transform="translate(20, 260)">
