    <text x="660" y="266" font-size="12" fill="#333333">Likely fake.</text>
    <text x="660" y="280" font-size="12" fill="#333333">FTC Reviews</text>
    <text x="660" y="294" font-size="12" fill="#333333">Rule violation</text>
    <text x="660" y="308" font-size="12" fill="#333333">($51,744/violation).</text>

