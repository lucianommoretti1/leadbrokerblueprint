      <text x="20" y="42" font-size="11" fill="#333333">(404) 555-0100  •  contact@smithlegal.com</text>
      <text x="20" y="74" font-size="10" fill="#1F3864" text-decoration="underline">Privacy Notice</text>
      <text x="100" y="74" font-size="10" fill="#1F3864" text-decoration="underline">Terms of Use</text>
      <text x="180" y="74" font-size="10" fill="#1F3864" text-decoration="underline">Do Not Sell or Share My Info</text>
      <text x="20" y="96" font-size="10" fill="#595959">Attorney advertising. Prior results do not guarantee a similar outcome.</text>
      <text x="20" y="110" font-size="10" fill="#595959">© 2026 Smith Legal Group. All rights reserved.</text>
