      <text x="20" y="20" font-size="8" fill="#808080">By submitting this form you consent to receive calls and texts from us and our partners about products and offers using auto-</text>
      <text x="20" y="32" font-size="8" fill="#808080">dialing technology and prerecorded voice. Your consent is not a condition of any purchase. Standard message and data rates may</text>
      <text x="20" y="44" font-size="8" fill="#808080">apply. Reply STOP to opt out. By clicking SUBMIT you agree to these terms.</text>
    </g>
    <text x="660" y="660" font-size="13" fill="#C00000" font-weight="700">⊗</text>
    <text x="660" y="678" font-size="12" fill="#333333">Consent buried,</text>
    <text x="660" y="692" font-size="12" fill="#333333">tiny font, no</text>
    <text x="660" y="706" font-size="12" fill="#333333">explicit checkbox.</text>
    <text x="660" y="720" font-size="12" fill="#333333">Not clear &amp;</text>
    <text x="660" y="734" font-size="12" fill="#333333">conspicuous;</text>
    <text x="660" y="748" font-size="12" fill="#333333">PEWC defective.</text>

    <!-- Pop-up overlay (simulated) -->
    <g transform="translate(20, 700)">
      <rect x="0" y="0" width="600" height="100" rx="4" fill="#FFEB84" stroke="#C00000" stroke-width="1"/>
      <text x="300" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#C00000">⚠ WAIT! Special offer expires in 4:59 ⚠</text>
      <text x="300" y="48" text-anchor="middle" font-size="12" fill="#333333">Don't leave! Enter your email NOW and get a FREE consultation!</text>
      <text x="300" y="64" text-anchor="middle" font-size="11" fill="#595959">[Email field] [BLOCKING POP-UP BUTTON]</text>
      <text x="300" y="84" text-anchor="middle" font-size="10" fill="#808080">(Visitor cannot close without entering email.)</text>
    </g>
    <text x="660" y="740" font-size="13" fill="#C00000" font-weight="700">⊗</text>

    <!-- No footer compliance -->
    <g transform="translate(20, 820)">
      <rect x="0" y="0" width="600" height="160" rx="4" fill="#F7F7F7" stroke="#BFBFBF"/>
      <text x="20" y="24" font-size="11" fill="#808080">Copyright 2026. All rights reserved.</text>
      <text x="20" y="44" font-size="11" fill="#808080">(No address. No privacy notice. No CCPA opt-out link.</text>
      <text x="20" y="60" font-size="11" fill="#808080">No attorney advertising disclaimer.)</text>
    </g>
    <text x="660" y="860" font-size="13" fill="#C00000" font-weight="700">⊗</text>
    <text x="660" y="878" font-size="12" fill="#333333">Missing physical</text>
    <text x="660" y="892" font-size="12" fill="#333333">address (CAN-</text>
    <text x="660" y="906" font-size="12" fill="#333333">SPAM); no CCPA</text>
    <text x="660" y="920" font-size="12" fill="#333333">opt-out link; no</text>
    <text x="660" y="934" font-size="12" fill="#333333">attorney-advertising</text>
    <text x="660" y="948" font-size="12" fill="#333333">disclaimer.</text>
