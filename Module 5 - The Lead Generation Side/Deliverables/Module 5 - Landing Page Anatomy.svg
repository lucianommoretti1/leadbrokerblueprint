      <rect x="0" y="0" width="600" height="30" fill="#C00000"/>
      <text x="20" y="20" font-size="13" font-weight="700" fill="#FFFFFF">Get Started — fill out all 15 fields below</text>

      <text x="20" y="55" font-size="11" fill="#333333">First name *</text>
      <rect x="20" y="60" width="270" height="18" rx="3" fill="#F7F7F7" stroke="#BFBFBF"/>
      <text x="310" y="55" font-size="11" fill="#333333">Last name *</text>
      <rect x="310" y="60" width="270" height="18" rx="3" fill="#F7F7F7" stroke="#BFBFBF"/>

      <text x="20" y="98" font-size="11" fill="#333333">Email *</text>
      <rect x="20" y="103" width="270" height="18" rx="3" fill="#F7F7F7" stroke="#BFBFBF"/>
      <text x="310" y="98" font-size="11" fill="#333333">Phone *</text>
      <rect x="310" y="103" width="270" height="18" rx="3" fill="#F7F7F7" stroke="#BFBFBF"/>

      <text x="20" y="141" font-size="11" fill="#333333">SSN (last 4) *</text>
      <rect x="20" y="146" width="270" height="18" rx="3" fill="#FDE9E9" stroke="#C00000"/>
      <text x="310" y="141" font-size="11" fill="#333333">DOB *</text>
      <rect x="310" y="146" width="270" height="18" rx="3" fill="#F7F7F7" stroke="#BFBFBF"/>

      <text x="20" y="184" font-size="11" fill="#333333">Bank account # *</text>
      <rect x="20" y="189" width="270" height="18" rx="3" fill="#FDE9E9" stroke="#C00000"/>
      <text x="310" y="184" font-size="11" fill="#333333">Routing # *</text>
      <rect x="310" y="189" width="270" height="18" rx="3" fill="#FDE9E9" stroke="#C00000"/>

      <text x="20" y="223" font-size="10" fill="#808080">[…and seven more fields]</text>

      <rect x="20" y="240" width="200" height="30" rx="4" fill="#C00000"/>
      <text x="120" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">SUBMIT ALL INFO</text>
    </g>
    <text x="660" y="360" font-size="13" fill="#C00000" font-weight="700">⊗</text>
    <text x="660" y="378" font-size="12" fill="#333333">15 fields incl.</text>
    <text x="660" y="392" font-size="12" fill="#333333">SSN, bank acct,</text>
    <text x="660" y="406" font-size="12" fill="#333333">routing — too</text>
    <text x="660" y="420" font-size="12" fill="#333333">much sensitive</text>
    <text x="660" y="434" font-size="12" fill="#333333">data; submission</text>
    <text x="660" y="448" font-size="12" fill="#333333">rates collapse.</text>
    <text x="660" y="468" font-size="12" fill="#333333">Single-page form</text>
    <text x="660" y="482" font-size="12" fill="#333333">vs. multi-step:</text>
    <text x="660" y="496" font-size="12" fill="#333333">lower completion.</text>

    <!-- Buried disclosure -->
