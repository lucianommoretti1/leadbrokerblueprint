    <text x="660" y="908" font-size="12" fill="#333333">CAN-SPAM-</text>
    <text x="660" y="922" font-size="12" fill="#333333">compliant address;</text>
    <text x="660" y="936" font-size="12" fill="#333333">CCPA opt-out link;</text>
    <text x="660" y="950" font-size="12" fill="#333333">attorney-advertising</text>
    <text x="660" y="964" font-size="12" fill="#333333">disclaimer (state-</text>
    <text x="660" y="978" font-size="12" fill="#333333">specific).</text>
  </g>

  <!-- ─────────────────────── RIGHT: BAD PAGE ─────────────────────── -->
  <g transform="translate(840, 120)">
    <rect x="0" y="0" width="640" height="1000" rx="8" fill="#FFFFFF" stroke="#C00000" stroke-width="3"/>

    <!-- Section: Header -->
