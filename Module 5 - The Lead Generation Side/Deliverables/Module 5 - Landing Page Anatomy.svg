      <text x="20" y="22" font-size="12" font-weight="700" fill="#C00000">Consent disclosure (clear and conspicuous, on this page):</text>
      <text x="20" y="44" font-size="11" fill="#333333">By submitting this form, I authorize Smith Legal Group and its</text>
      <text x="20" y="60" font-size="11" fill="#333333">named participating providers (listed at smithlegal.com/providers)</text>
      <text x="20" y="76" font-size="11" fill="#333333">to contact me by phone, including by automated telephone dialing</text>
      <text x="20" y="92" font-size="11" fill="#333333">system or prerecorded voice, and by SMS text message, about</text>
      <text x="20" y="108" font-size="11" fill="#333333">my potential case. I understand that my consent is not a condition</text>
      <text x="20" y="124" font-size="11" fill="#333333">of any purchase. Standard message and data rates may apply.</text>
