      <text x="20" y="24" font-size="13" font-weight="700" fill="#1F3864">What happens next:</text>
      <text x="20" y="46" font-size="12" fill="#333333">A case manager will call you within 15 minutes during business hours.</text>
      <text x="20" y="64" font-size="12" fill="#333333">The call takes 5-10 minutes. No obligation; you can end the call anytime.</text>
    </g>
