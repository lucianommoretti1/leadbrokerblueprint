    <text x="660" y="798" font-size="12" fill="#333333">Sets expectation;</text>
    <text x="660" y="812" font-size="12" fill="#333333">reduces post-submit</text>
    <text x="660" y="826" font-size="12" fill="#333333">surprise; improves</text>
    <text x="660" y="840" font-size="12" fill="#333333">intake conversion.</text>

