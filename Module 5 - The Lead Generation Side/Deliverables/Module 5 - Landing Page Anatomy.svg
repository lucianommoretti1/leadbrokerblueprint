<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Helvetica, Arial, sans-serif">
  <rect width="1600" height="1200" fill="#FAFBFD"/>

  <!-- Title -->
  <text x="800" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#1F3864">Landing Page Anatomy — What Converts vs. What Doesn't</text>
  <text x="800" y="80" text-anchor="middle" font-size="16" fill="#595959" font-style="italic">Module 5 deliverable  •  Lead Broker Blueprint by Luciano Moretti  •  v1.0 May 2026</text>

  <!-- ─────────────────────── LEFT: GOOD PAGE ─────────────────────── -->
  <g transform="translate(60, 120)">
