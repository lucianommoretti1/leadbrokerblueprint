      <text x="110" y="89" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">START CASE EVALUATION</text>
    </g>
    <text x="660" y="100" font-size="13" fill="#548235" font-weight="700">①</text>
    <text x="660" y="118" font-size="12" fill="#333333">Headline mirrors</text>
    <text x="660" y="132" font-size="12" fill="#333333">search query.</text>
    <text x="660" y="148" font-size="12" fill="#333333">One CTA, clear.</text>

