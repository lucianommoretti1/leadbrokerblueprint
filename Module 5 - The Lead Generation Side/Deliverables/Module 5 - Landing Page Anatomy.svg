      <rect x="0" y="0" width="600" height="30" fill="#1F3864"/>
      <text x="20" y="20" font-size="13" font-weight="700" fill="#FFFFFF">Step 1 of 3 — Tell us about your accident</text>

      <text x="20" y="58" font-size="12" font-weight="700" fill="#333333">When did the accident occur?</text>
