  <!-- Footer -->
  <text x="800" y="1170" text-anchor="middle" font-size="11" fill="#7F7F7F" font-style="italic">© Lead Broker Blueprint by Luciano Moretti  •  v1.0 May 2026.  Illustrative annotated examples; not legal advice.  See Modules 3 and 5 for regulatory and design substantiation.</text>
