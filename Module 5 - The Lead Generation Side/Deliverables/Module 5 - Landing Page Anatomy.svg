    <text x="660" y="618" font-size="12" fill="#333333">PEWC: clear,</text>
    <text x="660" y="632" font-size="12" fill="#333333">conspicuous,</text>
    <text x="660" y="646" font-size="12" fill="#333333">names parties,</text>
    <text x="660" y="660" font-size="12" fill="#333333">authorizes auto-</text>
    <text x="660" y="674" font-size="12" fill="#333333">dialer/prerecorded,</text>
    <text x="660" y="688" font-size="12" fill="#333333">states not a</text>
    <text x="660" y="702" font-size="12" fill="#333333">condition of</text>
    <text x="660" y="716" font-size="12" fill="#333333">purchase, signed</text>
    <text x="660" y="730" font-size="12" fill="#333333">(checkbox).</text>

