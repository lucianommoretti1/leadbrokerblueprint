<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" font-family="Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1600" height="1050" fill="#FAFBFD"/>

  <!-- Title block -->
  <text x="800" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#1F3864">The Lead Brokering Ecosystem — Money &amp; Information Flow</text>
  <text x="800" y="92" text-anchor="middle" font-size="18" fill="#595959" font-style="italic">Module 1 deliverable  •  Lead Broker Blueprint by Luciano Moretti  •  v1.0, May 2026</text>

  <!-- Direction-of-flow legend -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="1480" height="64" rx="8" fill="#EAF2FB" stroke="#1F3864" stroke-width="2"/>
    <!-- Info flow arrow -->
    <line x1="50" y1="32" x2="240" y2="32" stroke="#2E5496" stroke-width="3" marker-end="url(#arrowInfo)"/>
    <text x="260" y="38" font-size="16" fill="#1F3864" font-weight="600">Information flow  (consumer  →  advertiser)</text>

    <!-- Money flow arrow -->
    <line x1="900" y1="32" x2="710" y2="32" stroke="#C00000" stroke-width="3" marker-end="url(#arrowMoney)"/>
    <text x="920" y="38" font-size="16" fill="#C00000" font-weight="600">Money flow  (advertiser  →  traffic source)</text>
  </g>

  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowInfo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2E5496"/>
    </marker>
    <marker id="arrowMoney" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C00000"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7F7F7F"/>
    </marker>
  </defs>

  <!-- Player columns layout
       Five visible nodes, evenly spaced.
       Consumer (far left)  →  Traffic Source  →  Generator  →  Network / Broker  →  Advertiser  →  back to Consumer
       y for the row of nodes ≈ 360–600 -->

  <!-- CONSUMER -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="200" height="240" rx="14" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="44" rx="14" fill="#7F7F7F"/>
    <rect x="0" y="22" width="200" height="22" fill="#7F7F7F"/>
    <text x="100" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">CONSUMER</text>
    <text x="100" y="74" text-anchor="middle" font-size="13" fill="#1F3864" font-weight="600">The person looking for</text>
    <text x="100" y="92" text-anchor="middle" font-size="13" fill="#1F3864" font-weight="600">a service or product</text>

    <text x="14" y="124" font-size="12" fill="#333333">• Submits form,</text>
    <text x="14" y="142" font-size="12" fill="#333333">   makes call, or</text>
    <text x="14" y="160" font-size="12" fill="#333333">   opts in</text>
    <text x="14" y="184" font-size="12" fill="#333333">• Signs PEWC-</text>
    <text x="14" y="202" font-size="12" fill="#333333">   compliant consent</text>
    <text x="14" y="226" font-size="12" fill="#333333">• Becomes a lead</text>
  </g>

  <!-- TRAFFIC SOURCE -->
  <g transform="translate(340, 360)">
    <rect x="0" y="0" width="200" height="240" rx="14" fill="#FFFFFF" stroke="#2E5496" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="44" rx="14" fill="#2E5496"/>
    <rect x="0" y="22" width="200" height="22" fill="#2E5496"/>
    <text x="100" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">TRAFFIC SOURCE</text>
    <text x="100" y="74" text-anchor="middle" font-size="13" fill="#1F3864" font-weight="600">Where consumer</text>
    <text x="100" y="92" text-anchor="middle" font-size="13" fill="#1F3864" font-weight="600">interest originates</text>

    <text x="14" y="124" font-size="12" fill="#333333">• Paid search</text>
    <text x="14" y="142" font-size="12" fill="#333333">• Paid social</text>
    <text x="14" y="160" font-size="12" fill="#333333">• SEO &amp; content</text>
    <text x="14" y="178" font-size="12" fill="#333333">• Email / SMS</text>
    <text x="14" y="196" font-size="12" fill="#333333">• Affiliates</text>
    <text x="14" y="214" font-size="12" fill="#333333">• Outbound B2B</text>
    <text x="14" y="232" font-size="12" fill="#7F7F7F" font-style="italic">Google, Meta, TikTok…</text>
  </g>

  <!-- GENERATOR -->
  <g transform="translate(620, 360)">
    <rect x="0" y="0" width="200" height="240" rx="14" fill="#FFFFFF" stroke="#2E5496" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="44" rx="14" fill="#2E5496"/>
    <rect x="0" y="22" width="200" height="22" fill="#2E5496"/>
    <text x="100" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">GENERATOR</text>
    <text x="100" y="74" text-anchor="middle" font-size="13" fill="#1F3864" font-weight="600">Creates the lead;</text>
    <text x="100" y="92" text-anchor="middle" font-size="13" fill="#1F3864" font-weight="600">captures consent</text>

    <text x="14" y="124" font-size="12" fill="#333333">• Runs landing page</text>
    <text x="14" y="142" font-size="12" fill="#333333">• Captures form data</text>
    <text x="14" y="160" font-size="12" fill="#333333">• Records consent</text>
    <text x="14" y="178" font-size="12" fill="#333333">   (TrustedForm /</text>
    <text x="14" y="196" font-size="12" fill="#333333">   Jornaya certificate)</text>
    <text x="14" y="214" font-size="12" fill="#333333">• Validates lead</text>
    <text x="14" y="232" font-size="12" fill="#7F7F7F" font-style="italic">Independent shops / scale ops</text>
  </g>

  <!-- NETWORK / BROKER -->
  <g transform="translate(900, 360)">
    <rect x="0" y="0" width="220" height="240" rx="14" fill="#FFFFFF" stroke="#1F3864" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="44" rx="14" fill="#1F3864"/>
    <rect x="0" y="22" width="220" height="22" fill="#1F3864"/>
    <text x="110" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">NETWORK / BROKER</text>
    <text x="110" y="74" text-anchor="middle" font-size="13" fill="#1F3864" font-weight="600">Curates inventory;</text>
    <text x="110" y="92" text-anchor="middle" font-size="13" fill="#1F3864" font-weight="600">routes to buyers</text>

    <text x="14" y="124" font-size="12" fill="#333333">• Deduplicates</text>
    <text x="14" y="142" font-size="12" fill="#333333">• Scores / filters</text>
    <text x="14" y="160" font-size="12" fill="#333333">• Routes per contract</text>
    <text x="14" y="178" font-size="12" fill="#333333">• Manages disputes</text>
    <text x="14" y="196" font-size="12" fill="#333333">• Carries inventory</text>
    <text x="14" y="214" font-size="12" fill="#333333">   risk &amp; margin</text>
    <text x="14" y="232" font-size="12" fill="#7F7F7F" font-style="italic">QuinStreet, MediaAlpha…</text>
  </g>

  <!-- ADVERTISER -->
  <g transform="translate(1200, 360)">
    <rect x="0" y="0" width="200" height="240" rx="14" fill="#FFFFFF" stroke="#2E5496" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="44" rx="14" fill="#2E5496"/>
    <rect x="0" y="22" width="200" height="22" fill="#2E5496"/>
    <text x="100" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">ADVERTISER</text>
    <text x="100" y="74" text-anchor="middle" font-size="13" fill="#1F3864" font-weight="600">The end buyer who</text>
    <text x="100" y="92" text-anchor="middle" font-size="13" fill="#1F3864" font-weight="600">closes the customer</text>

    <text x="14" y="124" font-size="12" fill="#333333">• Attorney, contractor,</text>
    <text x="14" y="142" font-size="12" fill="#333333">   agent, lender, etc.</text>
    <text x="14" y="160" font-size="12" fill="#333333">• Runs intake on</text>
    <text x="14" y="178" font-size="12" fill="#333333">   delivered leads</text>
    <text x="14" y="196" font-size="12" fill="#333333">• Pays per lead /</text>
    <text x="14" y="214" font-size="12" fill="#333333">   call / appointment</text>
    <text x="14" y="232" font-size="12" fill="#7F7F7F" font-style="italic">The source of every dollar</text>
  </g>

  <!-- BACK TO CONSUMER (small node, far right) -->
  <g transform="translate(1450, 410)">
    <rect x="0" y="0" width="120" height="140" rx="12" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="2"/>
    <rect x="0" y="0" width="120" height="36" rx="12" fill="#7F7F7F"/>
    <rect x="0" y="18" width="120" height="18" fill="#7F7F7F"/>
    <text x="60" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">CONSUMER</text>
    <text x="60" y="62" text-anchor="middle" font-size="11" fill="#1F3864" font-weight="600">Becomes a</text>
    <text x="60" y="78" text-anchor="middle" font-size="11" fill="#1F3864" font-weight="600">customer</text>
    <text x="60" y="100" text-anchor="middle" font-size="10" fill="#333333">Loop closes when</text>
    <text x="60" y="114" text-anchor="middle" font-size="10" fill="#333333">advertiser transacts</text>
    <text x="60" y="128" text-anchor="middle" font-size="10" fill="#333333">with consumer.</text>
  </g>

  <!-- INFO FLOW arrows (left to right, top of nodes) -->
  <g>
    <!-- Consumer → Traffic Source -->
    <line x1="262" y1="430" x2="335" y2="430" stroke="#2E5496" stroke-width="3" marker-end="url(#arrowInfo)"/>
    <!-- Traffic Source → Generator -->
    <line x1="542" y1="430" x2="615" y2="430" stroke="#2E5496" stroke-width="3" marker-end="url(#arrowInfo)"/>
    <!-- Generator → Network -->
    <line x1="822" y1="430" x2="895" y2="430" stroke="#2E5496" stroke-width="3" marker-end="url(#arrowInfo)"/>
    <!-- Network → Advertiser -->
    <line x1="1122" y1="430" x2="1195" y2="430" stroke="#2E5496" stroke-width="3" marker-end="url(#arrowInfo)"/>
    <!-- Advertiser → Consumer (the close) -->
    <line x1="1402" y1="480" x2="1448" y2="480" stroke="#7F7F7F" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowGray)"/>
  </g>

  <!-- INFO-FLOW labels above the arrows -->
  <text x="298" y="416" text-anchor="middle" font-size="11" fill="#2E5496" font-weight="600">click / call /</text>
  <text x="298" y="430" text-anchor="middle" font-size="11" fill="#2E5496" font-weight="600">submission</text>

  <text x="578" y="416" text-anchor="middle" font-size="11" fill="#2E5496" font-weight="600">raw consumer</text>
  <text x="578" y="430" text-anchor="middle" font-size="11" fill="#2E5496" font-weight="600">interest</text>

  <text x="858" y="416" text-anchor="middle" font-size="11" fill="#2E5496" font-weight="600">structured lead</text>
  <text x="858" y="430" text-anchor="middle" font-size="11" fill="#2E5496" font-weight="600">+ consent record</text>

  <text x="1158" y="416" text-anchor="middle" font-size="11" fill="#2E5496" font-weight="600">filtered, routed</text>
  <text x="1158" y="430" text-anchor="middle" font-size="11" fill="#2E5496" font-weight="600">lead</text>

  <text x="1425" y="475" text-anchor="middle" font-size="10" fill="#7F7F7F" font-style="italic">closes loop</text>

  <!-- MONEY FLOW arrows (right to left, bottom of nodes) -->
  <g>
    <!-- Advertiser → Network -->
    <line x1="1195" y1="552" x2="1122" y2="552" stroke="#C00000" stroke-width="3" marker-end="url(#arrowMoney)"/>
    <!-- Network → Generator -->
    <line x1="895" y1="552" x2="822" y2="552" stroke="#C00000" stroke-width="3" marker-end="url(#arrowMoney)"/>
    <!-- Generator → Traffic Source -->
    <line x1="615" y1="552" x2="542" y2="552" stroke="#C00000" stroke-width="3" marker-end="url(#arrowMoney)"/>
    <!-- Traffic Source → Consumer? No — Consumer is paid attention with content/value, not cash. So we stop here. -->
  </g>

  <!-- MONEY-FLOW labels below the arrows -->
  <text x="1158" y="580" text-anchor="middle" font-size="11" fill="#C00000" font-weight="600">$ per lead</text>
  <text x="1158" y="594" text-anchor="middle" font-size="11" fill="#C00000" font-weight="600">to buyer-side CPL</text>

  <text x="858" y="580" text-anchor="middle" font-size="11" fill="#C00000" font-weight="600">$ per lead</text>
  <text x="858" y="594" text-anchor="middle" font-size="11" fill="#C00000" font-weight="600">at supply CPL</text>

  <text x="578" y="580" text-anchor="middle" font-size="11" fill="#C00000" font-weight="600">$ ad spend or</text>
  <text x="578" y="594" text-anchor="middle" font-size="11" fill="#C00000" font-weight="600">paid commission</text>

  <text x="298" y="580" text-anchor="middle" font-size="11" fill="#7F7F7F" font-style="italic">consumer is not paid</text>
  <text x="298" y="594" text-anchor="middle" font-size="11" fill="#7F7F7F" font-style="italic">(receives offer / content)</text>

  <!-- Worked example panel (left bottom) -->
  <g transform="translate(60, 680)">
    <rect x="0" y="0" width="700" height="290" rx="12" fill="#FFFFFF" stroke="#1F3864" stroke-width="2"/>
    <rect x="0" y="0" width="700" height="42" rx="12" fill="#1F3864"/>
    <rect x="0" y="20" width="700" height="22" fill="#1F3864"/>
    <text x="24" y="28" font-size="16" font-weight="700" fill="#FFFFFF">Worked example — illustrative chain margins</text>
    <text x="24" y="68" font-size="13" fill="#1F3864" font-style="italic">Personal injury exclusive form lead.  Numbers are representative; real contracts vary.</text>

    <text x="24" y="100" font-size="13" fill="#333333" font-weight="600">Advertiser pays broker / network:</text>
    <text x="320" y="100" font-size="13" fill="#C00000" font-weight="700">$200 / lead</text>

    <text x="24" y="124" font-size="13" fill="#333333" font-weight="600">Broker pays network:</text>
    <text x="320" y="124" font-size="13" fill="#C00000" font-weight="700">$140 / lead</text>
    <text x="430" y="124" font-size="12" fill="#1F3864">→ broker margin ≈ $60</text>

    <text x="24" y="148" font-size="13" fill="#333333" font-weight="600">Network pays generator:</text>
    <text x="320" y="148" font-size="13" fill="#C00000" font-weight="700">$90 / lead</text>
    <text x="430" y="148" font-size="12" fill="#1F3864">→ network margin ≈ $50</text>

    <text x="24" y="172" font-size="13" fill="#333333" font-weight="600">Generator ad spend per converted lead:</text>
    <text x="320" y="172" font-size="13" fill="#C00000" font-weight="700">$50</text>
    <text x="430" y="172" font-size="12" fill="#1F3864">→ generator margin ≈ $40</text>

    <line x1="24" y1="190" x2="676" y2="190" stroke="#BFBFBF" stroke-width="1"/>

    <text x="24" y="216" font-size="13" fill="#1F3864" font-weight="700">Buyer's CAC math (10 leads to sign one case):</text>
    <text x="24" y="240" font-size="12" fill="#333333">CAC = 10 × $200 = $2,000 per signed case  •  Net case fee ≈ $15–20k  •  Headroom ≈ $13–18k.</text>
    <text x="24" y="262" font-size="12" fill="#333333">If intake conversion drops from 10% → 5%, CAC doubles to $4,000.  Quality controls CAC,</text>
    <text x="24" y="278" font-size="12" fill="#333333">not price.  This is why buyer conversations sound like fights about quality, not cost.</text>
  </g>

  <!-- Compliance / platform sidebar (right bottom) -->
  <g transform="translate(800, 680)">
    <rect x="0" y="0" width="740" height="290" rx="12" fill="#FFFFFF" stroke="#C00000" stroke-width="2"/>
    <rect x="0" y="0" width="740" height="42" rx="12" fill="#C00000"/>
    <rect x="0" y="20" width="740" height="22" fill="#C00000"/>
    <text x="24" y="28" font-size="16" font-weight="700" fill="#FFFFFF">Plumbing &amp; compliance layer (sits across the chain)</text>

    <text x="24" y="68" font-size="13" font-weight="700" fill="#1F3864">Distribution platforms</text>
    <text x="24" y="86" font-size="12" fill="#333333">LeadConduit (ActiveProspect), Boberdoo, Phonexa, Leadspedia. Filter, enrich, and</text>
    <text x="24" y="102" font-size="12" fill="#333333">route leads between generators, networks, and advertisers.</text>

    <text x="24" y="128" font-size="13" font-weight="700" fill="#1F3864">Consent capture</text>
    <text x="24" y="146" font-size="12" fill="#333333">TrustedForm, Jornaya. Produce tamper-evident certificates proving what consumer</text>
    <text x="24" y="162" font-size="12" fill="#333333">saw and clicked. Required contractually by most sophisticated buyers.</text>

    <text x="24" y="188" font-size="13" font-weight="700" fill="#1F3864">Call routing &amp; tracking</text>
    <text x="24" y="206" font-size="12" fill="#333333">Ringba, Retreaver, CallRail, Invoca. Pay-per-call routing, dynamic number insertion,</text>
    <text x="24" y="222" font-size="12" fill="#333333">attribution, recording (state-by-state consent laws apply).</text>

    <text x="24" y="248" font-size="13" font-weight="700" fill="#C00000">Regulatory surface</text>
    <text x="24" y="266" font-size="12" fill="#333333">TCPA (FCC), Reviews &amp; Endorsements Rules (FTC), TSR, FCRA, CAN-SPAM, state</text>
    <text x="24" y="282" font-size="12" fill="#333333">privacy laws, ABA Model Rules, NMLS, RESPA Section 8, EKRA. Module 3 covers.</text>
  </g>

  <!-- Footer -->
  <text x="800" y="1020" text-anchor="middle" font-size="11" fill="#7F7F7F" font-style="italic">© Lead Broker Blueprint by Luciano Moretti  •  v1.0 May 2026.  Research-based primer, not operator playbook.  Verify regulatory citations against primary sources before relying on them.</text>
</svg>
